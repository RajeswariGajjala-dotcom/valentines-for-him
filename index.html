<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Boyfriend 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <h1 class="animated-text">Happy Valentine's Day! 💖</h1>
        <p class="subtitle">This is a special page just for you 💘</p>
        <!-- Animated hearts and romantic message -->
        <div class="hearts-bg"></div>
        <div class="romantic-center">
            <p class="tamil-romance animated-fade" style="font-size:1rem; color:#b8004c; font-weight:500;">
                <span style="color:#e75480; font-size:1em;">நீ இல்லாத நாளில், சாம்பார் இல்லாத சோறு மாதிரி! 🍚</span><br>
                <!-- <span style="color:#d72660; font-size:1em;">உன்னோட reply இல்லாத chat, blue tick மாதிரி! ✔️✔️</span><br>
                <span style="color:#b8004c; font-size:1em;">நீ சிரிச்சா, என் heart GIF மாதிரி jump ஆகுது! 💓🕺</span> -->
            </p>
        </div>
        <div class="important-question romantic-center animated-pop" id="important-question">
            <h2 class="animated-text pulse rainbow-text" style="font-size:2.3rem; color:#e75480; text-shadow:0 0 16px #ffb6c1;">நான் உன்னிடம் ஒரு ரொம்ப முக்கியமான கேள்வி கேட்கலாமா? 🤔<br><span style="font-size:1.1em; color:#b8004c;">(No சொன்னா, உனக்கு parcel-ல bitter gourd அனுப்புவேன்! 🥒😂)</span></h2>
            <div class="valentine-btns playful-btns">
                <button id="important-yes-btn" class="valentine-btn yes heart-beat">ஆமா 😁</button>
                <button id="important-no-btn" class="valentine-btn no shake">வேண்டாம் 🙃</button>
            </div>
            <div id="important-result" class="valentine-result"></div>
        </div>
        <div class="valentine-reveal romantic-center" id="valentine-reveal" style="display:none;">
            <img src="valentine.png" alt="Valentine Image" class="valentine-img animated-fade" style="width:50%; max-width:250px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 4px 24px rgba(255, 0, 98, 0.10); display:block; margin-left:auto; margin-right:auto;">
            <h2 class="animated-text" style="font-size:2rem; color:#e75480;">நீ எங்க Valentine ஆக வருவியா? 💝</h2>
            <div class="valentine-btns playful-btns">
                <button id="yes-btn" class="valentine-btn yes">ஆமா 💖</button>
                <button id="no-btn" class="valentine-btn no">வேண்டாம் 🙈</button>
            </div>
            <div id="valentine-result" class="valentine-result"></div>
        </div>
        <!-- Optional: Add music (uncomment and add your mp3 file in the folder)
        <div class="music-player">
            <button onclick="document.getElementById('valentine-music').play()" class="music-btn">🎵 Play Our Song</button>
            <audio id="valentine-music" src="your-music.mp3"></audio>
        </div>
        -->
    </div>
    <script src="script.js"></script>
</body>
</html>
